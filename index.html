<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app has no dark theme -- without this, some browsers (notably
         Android Chrome's "force dark") auto-invert pages that don't declare
         a color-scheme, mangling this light-only design. -->
    <meta name="color-scheme" content="light" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ponder</title>

    <!-- Installable-PWA support: lets "Add to Home Screen" launch standalone
         (no browser chrome, own icon) instead of just bookmarking a tab, and
         keeps the signed-in session across launches -- see LoginPage's
         code-based sign-in for why that matters (a magic-link click always
         opens the OS's default browser, never back into this). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1c2024" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ponder" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
